[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensak"
dynamic = ["version"]
description = "OpenSAK — Open Source geocaching management tool (GSAK successor)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# ── Dependency bounds (issue #897) ───────────────────────────────────────────
# Every dependency has an upper bound, set just above the version CI was last
# verified green against. CI and the release builds (build.yml,
# build-msix.yml) install from these ranges, so an upstream release can no
# longer break `beta` or change what ships inside the binaries without us
# choosing it.
#
# Upgrading a dependency is a deliberate change: raise the bound in its own
# PR, let CI run, fix whatever breaks there — not in the middle of an
# unrelated merge.
#
# Deliberately left without an upper bound:
#   certifi  — CA bundle; must always be the newest to stay secure.
#   pywin32  — plain build numbers (306, 307, …), no semver to cap on.
#
# Fast-moving tools that routinely add new checks/behaviour in minor releases
# (SQLAlchemy, PySide6, mypy) are capped at the next MINOR version; the rest
# at the next MAJOR.
#
# Before lifting sqlalchemy past <2.2: replace the deprecated noload() (#898).
dependencies = [
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13,<2",
    "lxml>=5.0,<7",
    "PySide6>=6.6,<6.12",
    "numpy>=1.24,<3",
    "certifi>=2024.2.2",
    "shapely>=2.0,<3",
    "pywin32>=306; platform_system == 'Windows'",
    "keyring>=25.0,<26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "pytest-qt>=4.0,<5",
    "mypy>=1.8,<2.4",
    "pillow>=10.0,<13",
]
# Release builds only (build.yml, build-msix.yml): `pip install -e ".[build]"`
build = [
    "pyinstaller>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "opensak.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests/unit-tests", "tests/e2e-tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"
# tests/screenshots is a separate, slower, opt-in suite for generating
# marketing/doc screenshots (site/, User Guide) — it must not run as part of
# a normal `pytest tests/` sweep. Run it explicitly: pytest tests/screenshots -v
norecursedirs = [".git", ".venv", "build", "dist", "tests/screenshots"]
markers = [
    "gui: tests that require a display and pytest-qt",
]

# The whole repo is type-checked: package, entry point, scripts and tests.
[tool.mypy]
files = ["src/opensak", "run.py", "scripts", "tests"]
# The hyphenated test dirs can't be packages, so the two suite-level
# conftest.py files both map to module "conftest". Exclude the e2e one here to
# break the clash; it is type-checked on its own in the quality workflow.
exclude = ["tests/e2e-tests/conftest.py"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true

[project.scripts]
opensak = "opensak.utils.run_cli:main"
opensak-test = "opensak.utils.run_test:run"
opensak-doctor = "opensak.utils.doctor:run"