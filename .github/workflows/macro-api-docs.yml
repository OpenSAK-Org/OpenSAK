name: Macro API docs

# Regenerates the Lua macro API reference (docs/macros/api.md) and the editor
# files in macros/types/ (Lua Language Server stub, ...) — GENERATED_FILES in
# src/opensak/macro/api_docs.py — from the API registry in
# src/opensak/macro/runtime.py, then opens — or updates — a single rolling
# Pull Request against `beta` with the result. It never pushes to `beta`.
#
# Feature branches don't commit these generated files: two PRs that both add
# macro functions would otherwise always conflict in them. They are
# regenerated here once the PRs are merged. create-pull-request only opens or
# updates the PR when the generated files actually differ from `beta`.
#
# The PR is opened with GITHUB_TOKEN, so it doesn't trigger CI by itself —
# same as the screenshot PRs. Merge any pending docs PR before tagging a
# release (docs/RELEASE_CHECKLIST.md).

on:
  push:
    branches: [beta]
    # Everything the generator reads: the registry and every module the
    # rendered text comes from (runtime.py, api_docs.py, cache_data.py,
    # editor_support.py, and new ones like a Lua stdlib table or the cache
    # write field lists — all kept in src/opensak/macro/), the example macros
    # listed in api.md, and the generator script itself. A generated text
    # that starts to depend on a file outside these paths must add it here.
    paths:
      - "src/opensak/macro/**"
      - "macros/examples/**"
      - "scripts/generate_macro_api_docs.py"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two quick merges to beta must not race on the same PR branch.
concurrency:
  group: macro-api-docs
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The generator imports opensak.macro (no Qt), so the base install is
      # enough — no setup-qt needed.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Regenerate macro API docs
        run: python scripts/generate_macro_api_docs.py

      - name: Open or update the docs PR
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: beta
          # Fixed name: every run updates the same open PR instead of
          # opening a new one per push.
          branch: bot/macro-api-docs
          delete-branch: true
          title: "docs: regenerate macro API docs"
          commit-message: "docs: regenerate macro API docs"
          # Every file in GENERATED_FILES (opensak/macro/api_docs.py) lives
          # under one of these: the reference plus all editor files (LuaLS
          # stub, and editor syntax/completion files as they are added).
          # test_macro_api_docs checks that nothing generated falls outside.
          add-paths: |
            docs/macros/api.md
            macros/types/
          labels: documentation
          body: |
            Auto-generated by the Macro API docs workflow from `${{ github.sha }}`
            (`python scripts/generate_macro_api_docs.py`).

            Only `docs/macros/api.md` and `macros/types/opensak.lua` change here.
            Later merges to `beta` that touch the macro API update this same PR.
            Merge it before tagging a release.
