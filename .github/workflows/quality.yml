name: Quality

# Reusable static-analysis gate: mypy over the whole repo
# (package, entry point, scripts and tests — see [tool.mypy] in pyproject.toml).
on:
  workflow_call:

jobs:
  typecheck:
    # Pinned to 24.04 while ubuntu-latest migrates to 26.04 (Oct 19 - Nov 19 2026,
    # actions/runner-images#14748). A gradual rollout would make this job flip
    # between images run to run. Unpin once 26.04 is verified green.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy
        run: mypy
      # Checked separately: it shares the module name "conftest" with the unit
      # suite's conftest, so mypy can't load both in one run (see pyproject).
      - name: Run mypy on the e2e conftest
        run: mypy tests/e2e-tests/conftest.py
