name: Tests

# Reusable test suite: called by ci.yml (push/PR) and build.yml (release gate).
on:
  workflow_call:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    # Belt-and-suspenders alongside the apt retry/timeout logic in
    # setup-qt: caps a stuck job at 30 min instead of GitHub's 360-min
    # default, so a hang anywhere in the job fails fast and visibly.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pinned to 24.04 while ubuntu-latest migrates to 26.04 (Oct 19 - Nov 19 2026,
        # actions/runner-images#14748). A gradual rollout would make this job flip
        # between images run to run. Unpin once 26.04 is verified green.
        os: [ubuntu-24.04]
        python-version: ["3.11", "3.12"]
        # The app ships on Windows + macOS too — run unit tests there as well.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up Qt system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-qt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/unit-tests -v --cov=opensak --cov-report=term-missing --cov-fail-under=80
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Unit Test Coverage"
            echo ""
            coverage report --format=markdown --skip-covered --skip-empty
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-tests:
    needs: unit-tests
    # Pinned to 24.04 while ubuntu-latest migrates to 26.04 (Oct 19 - Nov 19 2026,
    # actions/runner-images#14748). A gradual rollout would make this job flip
    # between images run to run. Unpin once 26.04 is verified green.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: ./.github/actions/setup-qt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run e2e tests
        env:
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --disable-software-rasterizer"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/e2e-tests -v --cov=opensak --cov-report=term-missing
