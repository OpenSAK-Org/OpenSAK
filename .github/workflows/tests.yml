name: Tests

# Reusable test suite: called by ci.yml (push/PR) and build.yml (release gate).
on:
  workflow_call:

jobs:
  unit-tests:
    # A fixed name without the runner version, e.g. "unit-tests (linux, 3.11)",
    # so a new runner image doesn't change the check names the beta and main
    # rulesets require (#1108).
    name: unit-tests (${{ startsWith(matrix.os, 'windows') && 'windows' || startsWith(matrix.os, 'macos') && 'macos' || 'linux' }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Belt-and-suspenders alongside the apt retry/timeout logic in
    # setup-qt: caps a stuck job at 45 min instead of GitHub's 360-min
    # default, so a hang anywhere in the job fails fast and visibly.
    # Raised from 30: with ~7900 unit tests the Windows runner needs
    # 18-26 min, and a slow runner hit the 30-min cap (CI #1835).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 26.04 since Nov 2026 (verified in #1108)
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        # The app ships on Windows + macOS too — run unit tests there as well.
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Set up Qt system dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-qt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/unit-tests -v --cov=opensak --cov-report=term-missing --cov-fail-under=80
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Unit Test Coverage"
            echo ""
            coverage report --format=markdown --skip-covered --skip-empty
          } >> "$GITHUB_STEP_SUMMARY"

  e2e-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: ./.github/actions/setup-qt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run e2e tests
        env:
          QT_QPA_PLATFORM: xcb
          QTWEBENGINE_CHROMIUM_FLAGS: "--disable-gpu --disable-software-rasterizer"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/e2e-tests -v --cov=opensak --cov-report=term-missing
