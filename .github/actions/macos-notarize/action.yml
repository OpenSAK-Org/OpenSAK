name: "Notarize macOS disk image"
description: "Submit a signed .dmg to Apple notarization, wait for the result, staple the ticket, and verify Gatekeeper acceptance."

inputs:
  target-path:
    description: "Path to the signed .dmg to notarize"
    required: true
  apple-id:
    description: "Apple ID used for notarization"
    required: true
  app-specific-password:
    description: "App-specific password for the Apple ID (generated at appleid.apple.com)"
    required: true
  team-id:
    description: "Apple Developer Team ID"
    required: true

runs:
  using: "composite"
  steps:
    - name: Submit for notarization and wait
      shell: bash
      run: |
        set -euo pipefail

        SUBMIT_OUTPUT="$(xcrun notarytool submit "${{ inputs.target-path }}" \
          --apple-id "${{ inputs.apple-id }}" \
          --password "${{ inputs.app-specific-password }}" \
          --team-id "${{ inputs.team-id }}" \
          --wait \
          --timeout 60m 2>&1 | tee /dev/stderr)"

        SUBMISSION_ID="$(echo "$SUBMIT_OUTPUT" | awk '/id:/ {print $2; exit}')"
        echo "SUBMISSION_ID=$SUBMISSION_ID" >> "$GITHUB_ENV"

        if ! echo "$SUBMIT_OUTPUT" | grep -q "status: Accepted"; then
          echo "::error::Notarization did not report 'Accepted' — fetching Apple's log for details"
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "${{ inputs.apple-id }}" \
            --password "${{ inputs.app-specific-password }}" \
            --team-id "${{ inputs.team-id }}" || true
          exit 1
        fi

    - name: Staple notarization ticket
      shell: bash
      run: |
        set -uo pipefail
        # Stapling fetches the ticket from Apple's CloudKit service, which
        # now and then drops the connection ("The network connection was
        # lost", error 68) even though notarization itself succeeded — seen
        # on v1.21.0-beta.9. Retry a few times before failing the build.
        for attempt in 1 2 3 4 5; do
          if xcrun stapler staple "${{ inputs.target-path }}"; then
            exit 0
          fi
          echo "::warning::Stapling failed (attempt $attempt of 5), retrying in $((attempt * 20)) s"
          sleep $((attempt * 20))
        done
        echo "::error::Stapling failed after 5 attempts"
        exit 1

    - name: Verify Gatekeeper acceptance
      shell: bash
      run: |
        set -euo pipefail
        # Note: `spctl -a --type open` on a .dmg (without --context) commonly
        # reports "rejected / source=Insufficient Context" even when
        # notarization succeeded correctly — this is a documented Apple
        # quirk, not a real rejection. The --context flag below is Apple's
        # own recommended way to check a disk image correctly.
        spctl -a -t open -vvv --context context:primary-signature "${{ inputs.target-path }}"
        # `stapler validate` also looks the ticket up on Apple's CloudKit
        # service, which drops the connection now and then (error 68) —
        # seen on the macOS x86_64 runner for v1.21.0, after spctl had
        # already accepted the notarized image. Retry like the staple step.
        set +e
        for attempt in 1 2 3 4 5; do
          if xcrun stapler validate "${{ inputs.target-path }}"; then
            exit 0
          fi
          echo "::warning::Validating the stapled ticket failed (attempt $attempt of 5), retrying in $((attempt * 20)) s"
          sleep $((attempt * 20))
        done
        echo "::error::Validating the stapled ticket failed after 5 attempts"
        exit 1
